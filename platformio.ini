; =============================================================================
;  MYSTERIOUS MAZE 2026 - Micromouse firmware
;  Build:   pio run                 (mac dinh: BlackPill F411)
;           pio run -e bluepill_f103c8
;  Nap:     pio run -t upload       (ST-Link V2 qua SWD)
;  Monitor: pio device monitor      (USB-UART noi PA2/PA3, 115200)
; =============================================================================
[platformio]
default_envs = blackpill_f411ce

[env]
platform = ststm32
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags =
    -O2
    -Wall
    -DMAZE_SIZE=16
    -Ilib/MazeCore/src
lib_ldf_mode = deep+

[env:blackpill_f411ce]
board = blackpill_f411ce

[env:bluepill_f103c8]
board = bluepill_f103c8
; F103 chi co 20 KB RAM: tat planner theo thoi gian (van chay slalom/cheo nhung chon duong don gian hon)
build_flags = ${env.build_flags} -DMM_LOW_RAM
; F103C8 chi co 64KB flash. Neu tran, doi sang bluepill_f103c8_128k (da so chip co 128KB).
